<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Trusted unlock: an open padlock topped with a Wi-Fi fan, the two things
       the feature joins. -->
  <g fill="none" stroke="#3daee9" stroke-width="2" stroke-linecap="round">
    <!-- Wi-Fi arcs radiating from the shackle -->
    <path d="M9 9a10 10 0 0 1 14 0" opacity="0.55"/>
    <path d="M12 12a6 6 0 0 1 8 0" opacity="0.8"/>
  </g>
  <!-- Open shackle: the right leg lifted, so the lock reads as unlocked -->
  <path d="M12 17v-3a4 4 0 0 1 8 0" fill="none" stroke="#3daee9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="8" y="16" width="16" height="12" rx="2.5" fill="#3daee9"/>
  <circle cx="16" cy="21" r="1.8" fill="#ffffff"/>
  <rect x="15.1" y="21.5" width="1.8" height="4" rx="0.9" fill="#ffffff"/>
</svg>
